<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZÉNIT - Productos de Limpieza</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-zenit">
        <div class="logo-container">
            <img src="img/logo-zenit.png" alt="Zénit Logo" class="main-logo">
        </div>
        <p class="subtitle">Catálogo de Productos de Limpieza</p>
        
        <button class="btn-primario" style="max-width: 250px; margin: 15px auto 0; display: block;" onclick="descargarPDFPrecios()">
            📄 Descargar Lista de Precios
        </button>
    </header>

    <div class="buscador-container">
        <input type="text" id="input-busqueda" placeholder="Buscar producto, marca o categoría..." onkeyup="filtrarProductos()">
    </div>

    <div class="contenedor-principal">
        <main id="catalogo" class="grid-container">
        </main>

        <aside id="seccion-carrito">
            <h2>Tu Pedido</h2>
            
            <div id="items-carrito">
            </div>

            <div class="total-container">
                <strong>Total: $<span id="precio-total">0</span></strong>
            </div>

            <form id="form-datos">
                <div class="input-group">
                    <input type="text" id="nombre" placeholder="Nombre completo" required>
                </div>
                <div class="input-group">
                    <input type="text" id="direccion" placeholder="Dirección de entrega" required>
                </div>
                <div class="input-group">
                    <input type="tel" id="telefono" placeholder="Teléfono de contacto" required>
                </div>
                <div class="input-group">
                    <textarea id="notas" placeholder="Notas adicionales (timbre, depto, horario)"></textarea>
                </div>
                
                <button type="button" class="btn-primario" onclick="abrirRevision()">Revisar Pedido</button>
            </form>
        </aside>
    </div>

    <div id="modal-revision" class="modal hidden">
        <div class="modal-content">
            <h3>Confirmar Pedido</h3>
            <div id="resumen-pedido"></div>
            <div class="modal-buttons">
                <button onclick="cerrarModal()" class="btn-editar">Modificar</button>
                <button onclick="enviarWhatsApp()" class="btn-enviar">Enviar a WhatsApp 📱</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <script src="app.js"></script>

</body>
</html>
