<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZÉNIT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Productos de Limpieza</h1>
        <p>Armá tu pedido y envialo por WhatsApp</p>
    </header>

    <main id="catalogo" class="grid-container">
        </main>

    <section id="seccion-carrito">
        <h2>Tu Pedido</h2>
        <div id="items-carrito"></div>
        <div class="total-container">
            <strong>Total: $<span id="precio-total">0</span></strong>
        </div>

        <form id="form-datos">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="text" id="direccion" placeholder="Dirección de entrega" required>
            <input type="tel" id="telefono" placeholder="Teléfono de contacto" required>
            <textarea id="notas" placeholder="Notas (ej: timbre, horario)"></textarea>
            <button type="button" onclick="abrirRevision()">Revisar Pedido</button>
        </form>
    </section>

    <div id="modal-revision" class="modal hidden">
        <div class="modal-content">
            <h3>Confirmar Pedido</h3>
            <div id="resumen-pedido"></div>
            <div class="modal-buttons">
                <button onclick="cerrarModal()" class="btn-editar">Modificar</button>
                <button onclick="enviarWhatsApp()" class="btn-enviar">Enviar a WhatsApp 📱</button>
            </div>
        </div>
    </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
